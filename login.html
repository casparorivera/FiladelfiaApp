<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión — App Filadelfia</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0b2035">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(150deg,#0b2035,#123a68 60%,#1a3d5c);
    padding:24px 16px;
  }
  .tarjeta{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:18px;
    padding:32px 28px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    text-align:center;
  }
  .logo{width:92px;height:92px;border-radius:20px;margin-bottom:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .ministerio{font-size:11px;letter-spacing:1.5px;color:#5a6b80;font-weight:700;margin-bottom:2px}
  h1{margin:0 0 22px;font-size:21px;color:#123a68}

  label{display:block;text-align:left;font-size:13px;font-weight:700;color:#26364a;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;font-family:inherit}
  input:focus{outline:2px solid #2f6fc0;border-color:#2f6fc0}

  button{
    width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;
    background:#2f6fc0;color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:not-allowed}

  .estado{margin-top:14px;font-size:13.5px;padding:10px;border-radius:8px;display:none;white-space:pre-wrap}
  .estado.error{display:block;background:#fdecec;color:#9b1c1c}
  .estado.info{display:block;background:#eef2f7;color:#5a6b80}

  .pie{margin-top:22px;font-size:11.5px;color:#8a95a5}
</style>
</head>

    e.className = 'estado ' + tipo;
  }

  async function iniciarSesion(){
    const correo = document.getElementById('correo').value.trim();
    const contrasena = document.getElementById('contrasena').value;
    if (!correo || !contrasena) { mostrarEstado('Ingresa tu correo y tu contraseña.', 'error'); return; }

    const boton = document.getElementById('btnEntrar');
    boton.disabled = true;
    mostrarEstado('Ingresando...', 'info');

    try{
      const r = await fetch(URL_AUTENTICACION, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'login', correo, contrasena })
      });
      const datos = await r.json();

      if (datos.error) { mostrarEstado(datos.error, 'error'); boton.disabled = false; return; }

      try {
        localStorage.setItem('filadelfiaAppCorreo', correo);
        localStorage.setItem('filadelfiaAppToken', datos.token);
        localStorage.setItem('filadelfiaAppNombre', datos.nombre);
      } catch(e) {}

      mostrarEstado('¡Bienvenido, ' + datos.nombre + '! Entrando...', 'info');
      window.location.href = 'index.html';
    } catch(e){
      mostrarEstado('No se pudo conectar. Revisa tu conexión e intenta de nuevo.', 'error');
      boton.disabled = false;
    }
  }

  document.getElementById('contrasena').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') iniciarSesion();
  });

  // Si ya hay una sesión guardada en este dispositivo, no muestres el login otra vez.
  try {
    if (localStorage.getItem('filadelfiaAppCorreo') && localStorage.getItem('filadelfiaAppToken')) {
      window.location.href = 'index.html';
    }
  } catch(e) {}
</script>

</body>
</html>
