<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reunión Adicional - Ministerio de Alabanza Filadelfia</title>
<link rel="stylesheet" href="ensayo.css">
<style>
  .btn-listado{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #2B3A67;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-listado:hover{ opacity: .9; }
  .btn-listado:disabled{ opacity: .6; cursor: default; }
  .btn-listado-hint{
    font-size: 12px;
    color: #888;
    margin-top: 6px;
  }
  .meta-dia{
    font-size: 13px;
    color: #667;
    margin: -6px 0 14px;
  }
</style>
</head>
<body>

<header class="header">
<img src="images/logo-filadelfia.jpg" alt="Logo Ministerio">
<div>
<small>MINISTERIO DE ALABANZA</small>
<h1>FILADELFIA CENTRAL</h1>
</div>
</header>

<main class="container">

<section class="hero">
<h2 id="nombreEvento">📌 Reunión Adicional</h2>
<p id="fecha">Cargando fecha...</p>
<div>
  <button class="btn-listado" id="btnListado" onclick="abrirListadoCompleto()" disabled>
    🖨️ Generar listado completo de los scores
  </button>
  <div class="btn-listado-hint">Abre todas las canciones de la semana, una tras otra, en el visor de cifrados.</div>
</div>
</section>

<div id="contenido">Cargando listado musical...</div>

</main>

<script>
// Pestaña "Eventos" (Reunión Adicional) del Panel de Administración (Fecha/Sección/Orden/
// Canción/ID URL/Observación/Observación general/Hora/Tonalidad).
const URL_EVENTOS="https://docs.google.com/spreadsheets/d/e/2PACX-1vRgCDbPXxAAo1hNZG09m3gziQCap259U1hsgBvJgCd3xgZ5mxfb-HnaXufZsweBMCcdIVHsYsONF1pg/pub?gid=929561019&single=true&output=csv";

// URL del visor de cifrados — la misma que ya usas para cada canción.
const VISOR_BASE_URL = "https://casparorivera.github.io/alabanzafiladelfia/visor-cifrados.html";

function parseCSV(text){
let rows=[],row=[],cell="",quote=false;
for(let i=0;i<text.length;i++){
let c=text[i];
if(c=='"'){if(quote&&text[i+1]=='"'){cell+='"';i++;}else quote=!quote;}
else if(c==','&&!quote){row.push(cell);cell="";}
else if((c=='\n'||c=='\r')&&!quote){if(c=='\r'&&text[i+1]=='\n')i++;row.push(cell);rows.push(row);row=[];cell="";}
else cell+=c;
}
if(cell||row.length){row.push(cell);rows.push(row);}
let headers=rows.shift().map(x=>x.trim());
return rows.filter(r=>r.length).map(r=>{let o={};headers.forEach((h,i)=>o[h]=(r[i]||"").trim());return o;}).filter(o=>Object.values(o).some(v=>v));
}

async function csv(url){return parseCSV(await (await fetch(url)).text());}

/** Convierte "2026-09-15" a fecha local (evita el corrimiento de un día
 * que da new Date('2026-09-15') por interpretarse como UTC). */
function fechaISOaLocal(iso){
  const p=(iso||"").split("-");
  if(p.length===3) return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  return new Date(iso);
}
function fechaLarga(iso){
  const x=fechaISOaLocal(iso);
  if(isNaN(x)) return iso||"";
  const d=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return `${d[x.getDay()]} ${x.getDate()} de ${m[x.getMonth()]}`;
}

/** Convierte cualquier hora (24h "14:30", o 12h ya con AM/PM en cualquier
 * variante) al formato "hh:mm a. m./p. m." consistente. */
function formatoHora12(valor){
  if(!valor) return "";
  const texto=String(valor).trim();

  const con12=texto.match(/^(\d{1,2}):(\d{2})\s*([ap])/i);
  if(con12){
    const h=String(Number(con12[1])).padStart(2,"0");
    return `${h}:${con12[2]} ${con12[3].toUpperCase()}. M.`;
  }

  const con24=texto.match(/^(\d{1,2}):(\d{2})$/);
  if(con24){
    let h=Number(con24[1]);
    const min=con24[2];
    const letra=h>=12 ? "P" : "A";
    h=h % 12 || 12;
    return `${String(h).padStart(2,"0")}:${min} ${letra}. M.`;
  }

  return texto;
}

// Guardamos las canciones ya cargadas para poder armar el link del
// listado completo sin volver a pedir el CSV.
let cancionesCargadas = [];

/** Saca el id=... de un link del visor de cifrados (…/visor-cifrados.html?id=XXXX). */
function extraerVisorId(link){
  if(!link) return null;
  const m = link.match(/[?&]id=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

async function cargar(){
let canciones=await csv(URL_EVENTOS);
cancionesCargadas = canciones;

if(!canciones.length){
  document.getElementById("nombreEvento").innerHTML="📌 Reunión Adicional";
  document.getElementById("fecha").innerHTML="📅 Sin programación cargada todavía";
  document.getElementById("contenido").innerHTML="";
  return;
}

// El nombre del evento/seminario sale de la Observación general de la
// primera fila — es un solo dato para todo el evento, aunque tenga varios
// días o intervenciones (cada "Sección" es una intervención, con su
// propia Fecha y Hora, agrupadas más abajo por Fecha + Sección).
const primera = canciones[0];
document.getElementById("nombreEvento").innerHTML =
  "📌 " + (primera["Observación general"] || "Reunión Adicional");

// Si todas las intervenciones caen en la misma fecha se muestra esa;
// si el evento abarca varios días se muestra el rango completo.
const fechasUnicas = [...new Set(canciones.map(c => c["Fecha"]).filter(Boolean))].sort();
document.getElementById("fecha").innerHTML = fechasUnicas.length <= 1
  ? `📅 ${fechaLarga(fechasUnicas[0] || primera["Fecha"])}`
  : `📅 Del ${fechaLarga(fechasUnicas[0])} al ${fechaLarga(fechasUnicas[fechasUnicas.length - 1])}`;

// Se agrupa por Sección (cada una es una intervención: "Día 1 - Mañana",
// "Día 2 - Noche", etc.), respetando el orden en que aparecen en la hoja.
let grupos={};
let ordenGrupos=[];
canciones.forEach(c=>{
let s=c["Sección"]||"General";
if(!grupos[s]){ grupos[s]=[]; ordenGrupos.push(s); }
grupos[s].push(c);
});
ordenGrupos.forEach(s=>grupos[s].sort((a,b)=>Number(a["Orden"])-Number(b["Orden"])));

let html="";

ordenGrupos.forEach(s=>{

const filasGrupo = grupos[s];
const primeraDelGrupo = filasGrupo[0];

// Cada intervención muestra su propia fecha y hora (pueden diferir de
// una intervención a otra dentro del mismo evento).
let meta="";
if(primeraDelGrupo["Fecha"]) meta += `📅 ${fechaLarga(primeraDelGrupo["Fecha"])}`;
if(primeraDelGrupo["Hora"]) meta += (meta ? " · " : "") + `⏰ Llegada: ${formatoHora12(primeraDelGrupo["Hora"])}`;

html+=`<section class="seccion"><h2>${s}</h2>`;
if(meta) html+=`<p class="meta-dia">${meta}</p>`;

filasGrupo.forEach(c=>{

html+=`
<article class="cancion">

<div>
<strong>${c["Orden"]||""}. ${c["Canción"]||""}</strong>
<p>🎹 Tonalidad: ${c["Tonalidad"]||""}</p>
</div>

<a target="_blank" href="${c["ID URL"]||"#"}">📄 Chart</a>

${c["Observación"] ?
`<div class="nota">
⚠️ <strong>Observación:</strong><br>
${c["Observación"]}
</div>` : ""}

</article>`;

});

html+="</section>";
});

document.getElementById("contenido").innerHTML=html;

const idsValidos = canciones.map(c => extraerVisorId(c["ID URL"])).filter(Boolean);
const btn = document.getElementById("btnListado");
btn.disabled = idsValidos.length === 0;
if(idsValidos.length < canciones.length){
  document.querySelector(".btn-listado-hint").innerHTML =
    `Abre ${idsValidos.length} de ${canciones.length} canciones en el visor — las demás no tienen todavía un link del visor cargado.`;
}
}

/** Arma el link combinado del visor con los IDs de todas las canciones
 * de la semana (en el mismo orden del listado) y lo abre en una
 * pestaña nueva — el visor las muestra una tras otra, ya con toda su
 * tipografía y diagramas, sin duplicar nada de su interfaz. */
function abrirListadoCompleto(){
  const ids = cancionesCargadas.map(c => extraerVisorId(c["ID URL"])).filter(Boolean);
  if(ids.length === 0){
    alert("Ninguna canción de esta semana tiene todavía un link del visor cargado.");
    return;
  }
  const url = `${VISOR_BASE_URL}?ids=${ids.map(encodeURIComponent).join(",")}`;
  window.open(url, "_blank");
}

cargar();
</script>

</body>
</html>
